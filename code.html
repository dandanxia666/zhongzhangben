<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>众账本 - 小组织经费透明账本</title>
<style>
/* ============================================================
   众账本视觉体系
   主色:紫 (accent) · 预警:琥珀 (amber) · 负数与红冲:红
   数字一律 tabular-nums;界面文字从简,信息靠层级不靠堆砌
   ============================================================ */
:root{
  --bg:#FAF9FC;
  --surface:#FFFFFF;
  --surface-2:#F6F4FB;
  --ink:#18181B;
  --ink-2:#52525B;
  --ink-3:#A1A1AA;
  --line:#E4E4E7;
  --line-strong:#D4D4D8;
  --accent:#7C3AED;
  --accent-ink:#FFFFFF;
  --accent-soft:#EDE9FE;
  --accent-hover:#6D28D9;
  --red:#DC2626;
  --red-soft:#FEE2E2;
  --amber:#B45309;
  --amber-soft:#FEF3C7;
  --amber-border:#FCD34D;
  --ok:#16A34A;
  --shadow:0 1px 3px rgba(24,24,27,.05),0 6px 20px rgba(124,58,237,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121118;--surface:#1A1924;--surface-2:#222030;
    --ink:#F4F4F5;--ink-2:#A1A1AA;--ink-3:#71717A;
    --line:#2E2B3E;--line-strong:#3F3B54;
    --accent:#A78BFA;--accent-ink:#0F0E17;--accent-soft:#2E284A;--accent-hover:#C4B5FD;
    --red:#F87171;--red-soft:#451A1A;
    --amber:#FBBF24;--amber-soft:#423014;--amber-border:#785412;
    --ok:#4ADE80;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121118;--surface:#1A1924;--surface-2:#222030;
  --ink:#F4F4F5;--ink-2:#A1A1AA;--ink-3:#71717A;
  --line:#2E2B3E;--line-strong:#3F3B54;
  --accent:#A78BFA;--accent-ink:#0F0E17;--accent-soft:#2E284A;--accent-hover:#C4B5FD;
  --red:#F87171;--red-soft:#451A1A;
  --amber:#FBBF24;--amber-soft:#423014;--amber-border:#785412;
  --ok:#4ADE80;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);font-size:14px;line-height:1.6;
  color:var(--ink);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,h4{text-wrap:balance}
button{font-family:inherit}
a{color:var(--accent)}
.num,td.num,th.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red)}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- 登录页 ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;max-width:960px;margin:0 auto;padding:32px 8px}
.login-brand h1{font-size:36px;margin:6px 0 10px;letter-spacing:1px;color:var(--accent)}
.brand-eyebrow{font-size:12px;letter-spacing:3px;color:var(--ink-3);font-weight:600}
.brand-tag{font-size:15px;color:var(--ink-2);margin:0 0 24px}
.brand-points{list-style:none;padding:0;margin:0;display:grid;gap:11px;max-width:420px}
.brand-points li{padding-left:18px;position:relative;color:var(--ink);font-size:13.5px}
.brand-points li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;background:var(--accent);border-radius:2px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
.login-card h2{margin:0 0 4px;font-size:18px}
.login-card .sub{color:var(--ink-2);margin:0 0 16px;font-size:13px}
.idpick{display:grid;gap:8px;margin-bottom:14px}
.idbtn{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px;color:var(--ink);text-align:left;transition:all .15s}
.idbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.idbtn.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent)}
.idbtn .r{font-size:12px;color:var(--ink-2)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.divider{height:1px;background:var(--line);margin:18px 0}
.guest-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.guest-row .t b{display:block;font-size:13.5px}
.guest-row .t span{color:var(--ink-2);font-size:12px}

/* ---------- 应用框架 ---------- */
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side-logo{font-size:19px;font-weight:800;letter-spacing:1px;padding:2px 10px 6px;color:var(--accent);display:flex;align-items:center;gap:8px}
.side-logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:50%}
.side-logo span{display:block;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:1.5px;margin-top:2px}
.nav{display:grid;gap:2px;margin-top:10px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s}
.nav a:hover{background:var(--surface-2);color:var(--accent)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:12px 11px 0;border-top:1px solid var(--line);line-height:1.7}
.main{min-width:0;padding:22px 32px 56px;max-width:1080px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .org{font-size:13px;color:var(--ink-2)}
.topbar .org b{color:var(--ink);font-size:15px;margin-right:8px}
.who{display:flex;align-items:center;gap:8px}
.who select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
h1.pt{font-size:21px;margin:0 0 4px;font-weight:700}
.psub{color:var(--ink-2);font-size:13px;margin:0 0 18px}

/* ---------- 卡片与磁贴 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:650}
.card + .card{margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;box-shadow:var(--shadow)}
.tile .tl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.tile .tv{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.tile.warn{border-color:var(--amber-border);background:var(--amber-soft)}
.tile.warn .tl{color:var(--amber);font-weight:600}
.tile.warn .tv{color:var(--amber)}
.eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13.5px}
.eq .f{font-variant-numeric:tabular-nums}
.eq .ok{color:var(--accent);font-weight:700}
.eq.bad{background:var(--red-soft);border-left-color:var(--red)}
.eq.bad .ok{color:var(--red)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- 徽章 ---------- */
.bdg{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-pend{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-border)}
.b-ok{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(124,58,237,.2)}
.b-red{background:var(--red-soft);color:var(--red);border:1px solid rgba(220,38,38,.2)}
.b-void{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.b-sys{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* ---------- 表格 ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.t th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:none}
.t td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--accent-soft)}
.t tr.sumrow td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-strong)}
.t td.empty{text-align:center;color:var(--ink-3);padding:26px 0}

/* ---------- 筛选栏 ---------- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar select,.filterbar input{
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;
}
.filterbar input{min-width:200px;flex:1;max-width:320px}
.filterbar .count{font-size:12.5px;color:var(--ink-3);margin-left:auto}

/* ---------- 表单 ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.fgrid .wide{grid-column:1/-1}
.line-row{display:grid;grid-template-columns:1.7fr 100px 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.line-row select,.line-row input{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
.del-line{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:6px;transition:color .15s}
.del-line:hover{color:var(--red)}
.balbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;border-radius:8px;padding:9px 16px;font-size:13px;font-variant-numeric:tabular-nums}
.balbar.ok{background:var(--accent-soft);color:var(--accent);font-weight:600}
.balbar.bad{background:var(--red-soft);color:var(--red);font-weight:600}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}

/* ---------- 胶囊按钮(模板/月份) ---------- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.subtab{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-2);transition:all .15s}
.subtab:hover{border-color:var(--accent);color:var(--accent)}
.subtab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.subtabs .cap{font-size:12px;color:var(--ink-3);margin-right:2px}

/* ---------- 校验清单 / 提示 ---------- */
.checkline{display:flex;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.checkline:last-child{border-bottom:none}
.checkline .st{width:16px;text-align:center;font-weight:800;flex:none}
.checkline.pass .st{color:var(--accent)}
.checkline.fail .st{color:var(--red)}
.checkline .d{margin-left:auto;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.warn-strip{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-border);border-radius:8px;padding:9px 14px;font-size:12.5px;margin-top:12px;font-weight:500}
.note{font-size:12.5px;color:var(--ink-3);margin-top:12px;line-height:1.7}

/* ---------- 弹层 ---------- */
.modal-back{position:fixed;inset:0;background:rgba(18,17,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px 30px;z-index:50;overflow:auto}
.sheet{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);max-width:620px;width:100%;padding:22px 24px;margin-top:6vh}
.sheet.narrow{max-width:460px}
.sheet h3{margin:0 0 3px;font-size:16.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--accent)}
.sheet .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:14px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.vmeta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px;margin:12px 0 14px}
.vmeta dt{color:var(--ink-2);white-space:nowrap}
.vmeta dd{margin:0}
.sheet textarea{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}

/* ---------- 提示条 ---------- */
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:80;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 18px;font-size:13px;box-shadow:var(--shadow);max-width:540px;font-weight:500}
.toast.err{background:var(--red);color:#fff}

/* ---------- 公示视图 ---------- */
.pub-top{border-bottom:1px solid var(--line);background:var(--surface)}
.pub-top .inner{max-width:1000px;margin:0 auto;padding:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pub-top .name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--accent)}
.pub-body{max-width:1000px;margin:0 auto;padding:20px 8px 50px}
.pub-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pub-head h1{font-size:21px;margin:0;font-weight:700}
.pub-foot{max-width:1000px;margin:0 auto;padding:0 8px 32px;color:var(--ink-3);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none}
.backlink:hover{text-decoration:underline}
.badkey{min-height:60vh;display:grid;place-items:center;padding:20px}
.badkey .card{max-width:420px;text-align:center}

/* ---------- 账簿 ---------- */
.led-grid{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start}
.led-side{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;max-height:calc(100vh - 140px);overflow:auto}
.led-group{font-size:11px;color:var(--ink-3);letter-spacing:1.5px;padding:10px 10px 4px;font-weight:600}
.led-acc{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;transition:all .15s}
.led-acc:hover{background:var(--surface-2);color:var(--accent)}
.led-acc.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.led-acc .code{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;margin-left:5px}
.led-acc.on .code{color:inherit}
.led-acc .b{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;font-size:12px}
.led-acc.on .b{color:inherit}
.led-child{margin-left:16px;font-size:12.5px}
.accpick{display:none}

/* ---------- 流程条 ---------- */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fstep{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0}
.fstep .no{font-size:11px;color:var(--ink-3);letter-spacing:1.5px;font-weight:600}
.fstep .nm{font-weight:700;font-size:13.5px;margin:3px 0 4px}
.fstep .st{font-size:12px;color:var(--ink-2);line-height:1.5;min-height:18px}
.fstep .act{margin-top:8px}
.fstep .act .btn{padding:3px 10px;font-size:12px}
.fstep.warn{border-color:var(--amber-border);background:var(--amber-soft)}
.fstep.warn .nm{color:var(--amber)}
.fstep.done{border-color:var(--accent);background:var(--accent-soft)}
.fstep.done .nm{color:var(--accent)}

/* ---------- 导航 ---------- */
.nav .ngroup{font-size:11px;color:var(--ink-3);letter-spacing:1.5px;padding:12px 12px 3px;font-weight:600}
.nav > .ngroup:first-child{padding-top:2px}
.navbadge{display:inline-block;min-width:18px;text-align:center;background:var(--amber);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 6px;margin-left:6px;vertical-align:1px}

/* ---------- 在线状态(多窗口协同) ---------- */
.pstrip{margin-top:7px;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.on-dot{color:var(--ok);font-weight:600;font-size:12px;white-space:nowrap}

/* ---------- 响应式 ---------- */
@media (max-width: 820px){
  .login{grid-template-columns:1fr;gap:24px;padding-top:20px}
  .login-brand h1{font-size:30px}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);padding:12px 4px}
  .side-logo{padding:0 8px}
  .nav{grid-template-columns:repeat(auto-fill,minmax(86px,1fr));margin-top:8px}
  .nav a{text-align:center;padding:8px 4px;justify-content:center}
  .nav .ngroup{display:none}
  .side-foot{display:none}
  .main{padding:16px 4px 44px}
  .fgrid{grid-template-columns:1fr}
  .line-row{grid-template-columns:1fr 78px 1fr 30px}
  .sheet{margin-top:12px}
  .led-grid{grid-template-columns:1fr}
  .led-side{display:none;max-height:none}
  .accpick{display:block;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;margin-bottom:12px}
  .filterbar input{min-width:0}
}

/* ---------- 打印(公示页) ---------- */
@media print{
  body{background:#fff;padding:0}
  .side,.topbar,.pub-actions,.no-print,#toasts,.toast{display:none!important}
  .shell{display:block}
  .main{padding:0;max-width:none}
  .card,.tablewrap,.tile{box-shadow:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toasts"></div>
<script>
(function(){
'use strict';

/* ==================================================================

function memberName0(S, id){
  var m = S.members.filter(function(x){ return x.id === id; })[0];
  return m ? m.name : id;
}

function log(S, actor, action, target, detail){
  S.audit.push({at: nowStamp(), actor:actor, action:action, target:target, detail:detail || ''});
}
function nowStamp(){
  var d = new Date();
  var p = function(n){ return n < 10 ? '0' + n : '' + n; };
  return TODAY + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function effV(S, upto){
  return S.vouchers.filter(function(v){
    return v.status === '已生效' && (!upto || v.date <= upto);
  });
}
function sums(list){
  var m = {};
  list.forEach(function(v){
    v.lines.forEach(function(l){
      var t = m[l.acc] || (m[l.acc] = {d:0, c:0});
      t[l.dc === '借' ? 'd' : 'c'] += c100(l.amt);
    });
  });
  return m;
}
function closedMonths(S){
  return S.closeLog.map(function(c){ return c.month; }).sort();
}
function isClosed(S, month){
  return S.closeLog.some(function(c){ return c.month === month; });
}
function dataMonths(S){
  var set = {};
  S.vouchers.forEach(function(v){ set[monthOf(v.date)] = true; });
  set[monthOf(TODAY)] = true;
  return Object.keys(set).sort();
}
function sumOf(map, code){
  var d = 0, c = 0;
  leafCodes(code).forEach(function(k){
    var s = map[k]; if (s){ d += s.d; c += s.c; }
  });
  return {d:d, c:c};
}
function trialBalance(S, month){
  var start = month + '-01', end = monthEnd(month);
  var open = sums(effV(S, end).filter(function(v){ return v.date < start; }));
  var per  = sums(effV(S, end).filter(function(v){ return v.date >= start; }));
  var rows = [], tpd = 0, tpc = 0, tdb = 0, tdc = 0;
  TOPS.forEach(function(a){
    var o = sumOf(open, a.code), p = sumOf(per, a.code);
    var on = isDebitCls(a.cls) ? o.d - o.c : o.c - o.d;
    var cn = on + (isDebitCls(a.cls) ? p.d - p.c : p.c - p.d);
    if (on !== 0 || p.d !== 0 || p.c !== 0){
      rows.push({code:a.code, name:a.name, cls:a.cls, detail:false,
        o:on, pd:p.d, pc:p.c, c:cn});
      accChildren(a.code).forEach(function(ch){
        var o2 = open[ch.code] || {d:0,c:0}, p2 = per[ch.code] || {d:0,c:0};
        var on2 = isDebitCls(a.cls) ? o2.d - o2.c : o2.c - o2.d;
        var cn2 = on2 + (isDebitCls(a.cls) ? p2.d - p2.c : p2.c - p2.d);
        if (on2 !== 0 || p2.d !== 0 || p2.c !== 0){
          rows.push({code:ch.code, name:ch.name, cls:a.cls, detail:true,
            o:on2, pd:p2.d, pc:p2.c, c:cn2});
        }
      });
      tpd += p.d; tpc += p.c;
      if (cn > 0){ if (isDebitCls(a.cls)) tdb += cn; else tdc += cn; }
      else if (cn < 0){ if (isDebitCls(a.cls)) tdc += -cn; else tdb += -cn; }
    }
  });
  return {rows:rows, tpd:tpd, tpc:tpc, tdb:tdb, tdc:tdc,
    ok: tpd === tpc && tdb === tdc};
}
function pnl(S, from, to){
  var inc = {}, exp = {};
  effV(S, to).forEach(function(v){
    if (v.system || v.date < from) return;
    v.lines.forEach(function(l){
      var cls = ACC[l.acc].cls, t = c100(l.amt) * (l.dc === '贷' ? 1 : -1);
      if (cls === 'inc'){ inc[l.acc] = (inc[l.acc] || 0) + t; }
      else if (cls === 'exp'){ exp[l.acc] = (exp[l.acc] || 0) - t; }
    });
  });
  var incT = 0, expT = 0;
  for (var k in inc) incT += inc[k];
  for (var e in exp) expT += exp[e];
  return {inc:inc, exp:exp, incT:incT, expT:expT, net:incT - expT};
}
function balanceSheet(S, asOf){
  var t = sums(effV(S, asOf));
  var assets = [], liabs = [], eqs = [], aT = 0, lT = 0, eT = 0;
  TOPS.forEach(function(a){
    var s = sumOf(t, a.code); if (!s.d && !s.c) return;
    if (a.cls === 'asset'){ var n = s.d - s.c; if (n !== 0){ assets.push({code:a.code,name:a.name,n:n}); aT += n; } }
    else if (a.cls === 'liab'){ var n2 = s.c - s.d; if (n2 !== 0){ liabs.push({code:a.code,name:a.name,n:n2}); lT += n2; } }
    else if (a.cls === 'eq'){ var n3 = s.c - s.d; if (n3 !== 0){ eqs.push({code:a.code,name:a.name,n:n3}); eT += n3; } }
  });
  var pending = 0;
  TOPS.forEach(function(a){
    var s = sumOf(t, a.code); if (!s.d && !s.c) return;
    if (a.cls === 'inc') pending += s.c - s.d;
    else if (a.cls === 'exp') pending -= s.d - s.c;
  });
  if (pending !== 0){
    eqs.push({code:'—', name:'待结转损益', n:pending});
    eT += pending;
  }
  var rhs = lT + eT;
  return {assets:assets, liabs:liabs, eqs:eqs, aT:aT, lT:lT, eT:eT, pending:pending,
    ok: aT === rhs, diff: aT - rhs};
}
function cashTotal(S, asOf){
  var t = sums(effV(S, asOf)), n = 0;
  LEAVES.forEach(function(a){ if (a.cash && t[a.code]) n += t[a.code].d - t[a.code].c; });
  return n;
}
function ledgerOf(S, code, month){
  var a = ACC[code];
  var codes = leafCodes(code);
  var start = month === 'all' ? null : month + '-01';
  var end = month === 'all' ? null : monthEnd(month);
  var open = 0, rows = [];
  var order = {};
  S.vouchers.forEach(function(v, i){ order[v.id] = i; });
  effV(S, end).forEach(function(v){
    var inPeriod = !start || v.date >= start;
    v.lines.forEach(function(l){
      if (codes.indexOf(l.acc) < 0) return;
      var amt = c100(l.amt);          /* 有符号:红冲为负,方向仍记原方向列 */
      var isD = l.dc === '借';
      if (!inPeriod){ open += isD ? amt : -amt; return; }
      rows.push({date:v.date, id:v.id, summary:v.summary, system:!!v.system,
        d: isD ? amt : 0, c: isD ? 0 : amt});
    });
  });
  rows.sort(function(x, y){
    return x.date === y.date ? order[x.id] - order[y.id] : (x.date < y.date ? -1 : 1);
  });
  var bal = open, dSum = 0, cSum = 0;
  rows.forEach(function(r){ bal += r.d - r.c; dSum += r.d; cSum += r.c; r.bal = bal; });
  return {acc:a, month:month, open:open, rows:rows, dSum:dSum, cSum:cSum, close:bal};
}
function voucherTotal(v){
  var n = 0;
  v.lines.forEach(function(l){ if (l.dc === '借') n += c100(l.amt); });
  return n;
}
function vtypeOf(lines){
  var net = 0;
  lines.forEach(function(l){
    if (ACC[l.acc] && ACC[l.acc].cash) net += c100(l.amt) * (l.dc === '借' ? 1 : -1);
  });
  return net > 0 ? '收' : (net < 0 ? '付' : '转');
}
function vtypeOfV(v){ return v.vtype || vtypeOf(v.lines); }
function pendingIn(S, month){

function assertWritable(S, date){
  var m = monthOf(date);
  if (isClosed(S, m)) return m + ' 已结账,该期间已冻结:录入、复核、红冲均被拒绝';
  var closed = closedMonths(S);
  if (closed.length && m < closed[closed.length - 1])
    return m + ' 早于已结账期间 ' + closed[closed.length - 1] + ',不能入账';
  if (date > TODAY) return '日期不能晚于今天(' + TODAY + ')';
  return null;
}
function nextId(S){
  var n = S.vouchers.length + 1, id;
  do { id = '记-' + ('00' + n).slice(-3); n++; } while (S.vouchers.some(function(v){ return v.id === id; }));
  return id;
}
function insertVoucher(S, v){
  v.id = nextId(S);
  S.vouchers.push(v);
  return v;
}
function createVoucher(S, actorId, payload){
  if (!payload.summary || !payload.summary.trim()) return {ok:false, err:'摘要不能为空'};
  var attach = payload.attach;
  if (attach === undefined || attach === null || attach === '') attach = 0;
  attach = +attach;
  if (!(attach >= 0) || Math.floor(attach) !== attach) return {ok:false, err:'附件张数须为 0 或正整数'};
  var freeze = assertWritable(S, payload.date);
  if (freeze) return {ok:false, err:freeze};
  if (!payload.lines || payload.lines.length < 2) return {ok:false, err:'分录至少两行'};
  var d = 0, c = 0;
  for (var i = 0; i < payload.lines.length; i++){
    var l = payload.lines[i];
    if (!ACC[l.acc]) return {ok:false, err:'第 ' + (i+1) + ' 行科目无效'};
    if (accChildren(l.acc).length) return {ok:false, err:accName(l.acc) + ' 是一级科目,请在明细科目上记账(如 ' + accChildren(l.acc)[0].name + ')'};
    if (!(l.amt > 0)) return {ok:false, err:'第 ' + (i+1) + ' 行金额必须大于 0'};
    if (l.dc === '借') d += c100(l.amt); else if (l.dc === '贷') c += c100(l.amt);
    else return {ok:false, err:'第 ' + (i+1) + ' 行方向无效'};
  }
  if (d !== c) return {ok:false, err:'借贷不平:借方 ' + fmt(d) + ',贷方 ' + fmt(c) + ',差额 ' + fmt(Math.abs(d-c)) + ',不许存'};
  var dup = {};
  for (var j = 0; j < payload.lines.length; j++){
    var key = payload.lines[j].acc + payload.lines[j].dc;
    if (dup[key]) return {ok:false, err:'同一科目同一方向出现两行,请合并'};
    dup[key] = true;
  }
  var v = insertVoucher(S, {
    date:payload.date, summary:payload.summary.trim(), lines:payload.lines,
    status:'待复核', by:actorId, at:nowStamp(), revBy:null, revAt:null,
    vtype: payload.vtype || vtypeOf(payload.lines), attach: attach,
    system:false, reverses:null, rejectNote:null, voidNote:null
  });
  log(S, memberName0(S, actorId), '制单', v.id, v.summary);
  return {ok:true, id:v.id};
}
function reviewVoucher(S, id, actorId, verdict, note){
  var v = S.vouchers.filter(function(x){ return x.id === id; })[0];
  if (!v) return {ok:false, err:'凭证不存在'};
  if (v.status !== '待复核') return {ok:false, err:'只有待复核凭证可以复核'};
  var freeze = assertWritable(S, v.date);
  if (freeze) return {ok:false, err:freeze};
  var who = memberName0(S, actorId);
  if (verdict === 'pass'){
    v.status = '已生效'; v.revBy = actorId; v.revAt = nowStamp();
    log(S, who, '复核通过', v.id, v.revBy === v.by ? '复核人与制单人相同,如实标注' : v.summary);
    return {ok:true, same:v.revBy === v.by};
  } else {
    v.status = '已驳回'; v.revBy = actorId; v.revAt = nowStamp(); v.rejectNote = note || '';
    log(S, who, '复核驳回', v.id, note || v.summary);
    return {ok:true};
  }
}
function reverseVoucher(S, id, actorId, reason){
  var v = S.vouchers.filter(function(x){ return x.id === id; })[0];
  if (!v) return {ok:false, err:'凭证不存在'};
  if (v.status !== '已生效') return {ok:false, err:'只有已生效凭证可以红冲'};
  var freeze = assertWritable(S, v.date);
  if (freeze) return {ok:false, err:freeze};
  var exists = S.vouchers.some(function(x){ return x.reverses === id && (x.status === '待复核' || x.status === '已生效'); });
  if (exists) return {ok:false, err:'该凭证已有红冲凭证(或待复核),不能重复红冲'};
  var lines = v.lines.map(function(l){ return {acc:l.acc, dc:l.dc, amt:-l.amt}; });
  var r = insertVoucher(S, {
    date:v.date, summary:'红冲 ' + v.id + ':' + (reason || v.summary), lines:lines,
    status:'待复核', by:actorId, at:nowStamp(), revBy:null, revAt:null,
    vtype: vtypeOfV(v), attach: 0,
    system:false, reverses:id, rejectNote:null, voidNote:null
  });
  log(S, memberName0(S, actorId), '红冲制单', r.id, '冲销 ' + v.id + ' · ' + (reason || v.summary));
  return {ok:true, id:r.id};
}
function canClose(S, month){
  var start = month + '-01', end = monthEnd(month);
  var pend = pendingIn(S, month);
  var tb = trialBalance(S, month);
  var bs = balanceSheet(S, end);
  var earlier = dataMonths(S).filter(function(m){ return m < month && !isClosed(S, m); });
  return {
    month:month,
    preOk: earlier.length === 0,
    preDetail: earlier.length ? earlier.join('、') + ' 尚未结账,须先结前序月份' : '前序月份均已结账',
    checks:[
      {label:'当月无待复核凭证', pass: pend.length === 0,
       detail: pend.length === 0 ? '当月凭证全部复核完毕' : pend.length + ' 笔待复核:' + pend.map(function(v){return v.id;}).join('、')},
      {label:'科目余额表:本期发生借 = 贷', pass: tb.tpd === tb.tpc,
       detail:'借方发生 ' + fmt(tb.tpd) + ' / 贷方发生 ' + fmt(tb.tpc)},
      {label:'期末恒等式:资产 = 负债 + 权益', pass: bs.ok,
       detail: fmt(bs.aT) + ' = ' + fmt(bs.lT) + ' + ' + fmt(bs.eT)}
    ]
  };
}
function closeMonth(S, month, actorId){
  if (isClosed(S, month)) return {ok:false, err:month + ' 已结账,不能重复结账;如需调整请先反结账'};
  var cc = canClose(S, month);
  if (!cc.preOk) return {ok:false, err:cc.preDetail};
  var failed = cc.checks.filter(function(c){ return !c.pass; });
  if (failed.length) return {ok:false, err:'结账校验未通过:' + failed.map(function(f){return f.label;}).join('、')};
  var end = monthEnd(month), date = end > TODAY ? TODAY : end;
  var p = pnl(S, month + '-01', end);
  var transferId = null;
  if (p.net !== 0){
    var lines = [], dn = 0, cn = 0;
    ACCOUNTS.forEach(function(a){
      if (a.cls === 'inc' && p.inc[a.code]){
        var n = p.inc[a.code];
        if (n > 0){ lines.push({acc:a.code, dc:'借', amt:n/100}); dn += n; }
        else if (n < 0){ lines.push({acc:a.code, dc:'贷', amt:-n/100}); cn += -n; }
      }
      if (a.cls === 'exp' && p.exp[a.code]){
        var e = p.exp[a.code];
        if (e > 0){ lines.push({acc:a.code, dc:'贷', amt:e/100}); cn += e; }
        else if (e < 0){ lines.push({acc:a.code, dc:'借', amt:-e/100}); dn += -e; }
      }
    });
    if (p.net > 0){ lines.push({acc:'3103', dc:'贷', amt:p.net/100}); cn += p.net; }
    else { lines.push({acc:'3103', dc:'借', amt:-p.net/100}); dn += -p.net; }
    if (dn !== cn) return {ok:false, err:'结转凭证生成异常,已中止'};
    var tv = insertVoucher(S, {
      date:date, summary:'系统结转:' + month + ' 损益结转至本年利润', lines:lines,
      status:'已生效', by:actorId, at:nowStamp(), revBy:actorId, revAt:nowStamp(),
      vtype:'转', attach:0,
      system:true, reverses:null, rejectNote:null, voidNote:null
    });
    transferId = tv.id;
    log(S, memberName0(S, actorId), '系统结转', tv.id, '结账自动生成');
  }
  S.closeLog.push({month:month, by:actorId, at:nowStamp(), transferId:transferId});
  log(S, memberName0(S, actorId), '结账', month,
    '三步校验通过' + (transferId ? ';损益结转生成 ' + transferId : ';当月损益为零,无结转凭证') + ',当月冻结');
  return {ok:true, transferId:transferId};
}
function uncloseLast(S, actorId){
  if (!S.closeLog.length) return {ok:false, err:'没有已结账期间'};
  var last = S.closeLog[S.closeLog.length - 1];
  if (last.transferId){
    var tv = S.vouchers.filter(function(v){ return v.id === last.transferId; })[0];
    if (tv){ tv.status = '已作废'; tv.voidNote = '反结账作废,不进入报表'; }
  }
  S.closeLog.pop();
  log(S, memberName0(S, actorId), '反结账', last.month,
    (last.transferId ? last.transferId + ' 转为作废,' : '') + '当月恢复可入账');
  return {ok:true, month:last.month};
}
function memberAdd(S, actorId, name, role){

function memberRemove(S, actorId, targetId){
  var m = S.members.filter(function(x){ return x.id === targetId; })[0];

  return {ok:true};

/* ---------------- 账簿 ---------------- */
function ledBalance(code){
  var t = sums(effV(S, null));
  var s = sumOf(t, code);
  var a = ACC[code];
  return isDebitCls(a.cls) ? s.d - s.c : s.c - s.d;
}
function ledgerSideHTML(){
  var html = '';
  CLS_ORDER.forEach(function(cls){
    html += '<div class="led-group">' + CLS_NAME[cls] + '类</div>';
    TOPS.filter(function(a){ return a.cls === cls; }).forEach(function(a){
      function item(code, name, child){
        var n = ledBalance(code);
        var on = code === ledAcc ? ' on' : '';
        return '<div class="led-acc' + on + (child ? ' led-child' : '') + '" onclick="A.pickAcc(\'' + code + '\')">' +
          '<span>' + esc(name) + '<span class="code">' + code + '</span></span>' +
          '<span class="b' + (n < 0 ? ' neg' : '') + '">' + money(n) + '</span></div>';
      }
      html += item(a.code, a.name, false);
      accChildren(a.code).forEach(function(ch){ html += item(ch.code, ch.name, true); });
    });
  });
  return html;
}
function accPickOptions(){
  var h = '';
  TOPS.forEach(function(a){
    if (!accChildren(a.code).length){
      h += '<option value="' + a.code + '"' + (a.code === ledAcc ? ' selected' : '') + '>' + esc(accShort(a.code)) + '</option>';
    } else {
      h += '<option value="' + a.code + '"' + (a.code === ledAcc ? ' selected' : '') + '>' + esc(accShort(a.code)) + '(汇总)</option>';
      accChildren(a.code).forEach(function(ch){
        h += '<option value="' + ch.code + '"' + (ch.code === ledAcc ? ' selected' : '') + '>' + esc(accShort(ch.code)) + '</option>';
      });
    }
  });

}

/* ==================================================================
   服务端模式通信层:API 调用 / SSE / 状态同步
   ================================================================== */
function apiFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + (API_TOKEN || '')
  });
  return fetch('/api' + path, opts).then(function(r){
    return r.json().then(function(j){ return { status: r.status, j: j }; });
  });
}
function apiPost(path, body){
  return apiFetch(path, { method: 'POST', body: JSON.stringify(body || {}) });
}
function syncFromServer(){
  return apiFetch('/state').then(function(r){
    if (r.status === 401){ API_TOKEN = null; try { localStorage.removeItem('zzb-token'); localStorage.removeItem('zzb-uid'); } catch(e){} sess.uid = null; return null; }
    if (r.j && r.j.ok){
      S = r.j.state; lastSeq = r.j.seq;
      if (r.j.online) serverOnline = r.j.online;
    }
    return r.j;
  }).catch(function(){ return null; });
}
/* 执行一个服务端操作:失败提示错误,成功后同步状态并重绘 */
function serverAction(path, body, okMsg){
  return apiPost(path, body).then(function(r){
    if (r.status === 401){ A.logout(); return null; }
    if (!r.j || !r.j.ok){ A.showToast((r.j && r.j.err) || '操作失败', true); return null; }
    if (r.j.seq) lastSeq = r.j.seq;
    return syncFromServer().then(function(){
      A.showToast(typeof okMsg === 'function' ? okMsg(r.j) : okMsg);
      route();
      return r.j;
    });
  }).catch(function(){ A.showToast('网络错误,请重试', true); return null; });
}
function applyRemoteUpdate(m){
  if (m.seq && m.seq <= lastSeq) return;
  if (m.online) serverOnline = m.online;
  syncFromServer().then(function(){
    if (location.hash === '#/new' && formDirty()){
      A.showToast((m.name || '其他成员') + ' ' + (m.info || '更新了账本') + '(已同步,当前表单输入保留)');
      return;
    }
    route();
    updatePresenceUI();
    A.showToast((m.name || '其他成员') + ' ' + (m.info || '更新了账本'));
  });
}
function openEvents(){
  if (!SERVER_MODE || !API_TOKEN || typeof EventSource === 'undefined') return;
  if (evtSrc) evtSrc.close();
  evtSrc = new EventSource('/api/events?token=' + encodeURIComponent(API_TOKEN));
  evtSrc.addEventListener('update', function(e){
    try { applyRemoteUpdate(JSON.parse(e.data)); } catch(err){}
  });
  evtSrc.addEventListener('presence', function(e){
    try {
      var d = JSON.parse(e.data);
      if (d && d.online){ serverOnline = d.online; updatePresenceUI(); }
    } catch(err){}
  });
}
function boot(){
  function done(){
    if (!SERVER_MODE){ route(); return; }
    try { API_TOKEN = localStorage.getItem('zzb-token') || null; } catch(e){ API_TOKEN = null; }
    if (API_TOKEN){
      syncFromServer().then(function(){ if (API_TOKEN) openEvents(); route(); });
    } else {
      apiFetch('/meta').then(function(r){
        if (r.j && r.j.ok){
          META = r.j;
          try { localStorage.setItem('zzb-meta', JSON.stringify(META)); } catch(e){}
        }
        route();
      }).catch(function(){ route(); });
    }
  }
  try {
    fetch('/api/ping').then(function(r){ return r.json(); })
      .then(function(j){ SERVER_MODE = !!(j && j.ok); })
      .catch(function(){ SERVER_MODE = false; })
      .then(done);
  } catch(e){ SERVER_MODE = false; done(); }
}

      if (!note || !note.trim()){ A.showToast('请填写驳回原因', true); return; }
      if (SERVER_MODE){
        A.closeModal();
        serverAction('/vouchers/' + encodeURIComponent(id) + '/review',
          { verdict: 'reject', note: note.trim() },
          '凭证 ' + id + ' 已驳回,可在详情中复制改正');
        return;
      }
      var r = reviewVoucher(S, id, sess.uid, 'reject', note.trim());
      if (r.ok){ save(); A.closeModal(); A.showToast('凭证 ' + id + ' 已驳回,可在详情中复制改正'); route(); }
      else A.showToast(r.err, true);
    });
  },
  reverseVoucher: function(id){
    A.askText('红冲原因', '业务录入有误,全额冲销更正', function(reason){
      if (!reason || !reason.trim()){ A.showToast('请填写红冲原因', true); return; }
      if (SERVER_MODE){
        A.closeModal();
        serverAction('/vouchers/' + encodeURIComponent(id) + '/reverse',
          { reason: reason.trim() },
          function(j){ return '已生成红冲凭证 ' + (j.id || '') + ',待复核'; });
        return;
      }
      var r = reverseVoucher(S, id, sess.uid, reason.trim());
      if (r.ok){ save(); A.closeModal(); A.showToast('已生成红冲凭证 ' + r.id + ',待复核'); route(); }
      else A.showToast(r.err, true);
    });
  },
  copyToNew: function(id){
    var v = S.vouchers.filter(function(x){ return x.id === id; })[0];
    if (!v) return;
    prefill = v;
    A.closeModal();
    A.nav('new');
  },

  /* 制单表单 */
  addLine: function(){
    var box = document.getElementById('lines-box');
    if (!box) return;
    box.insertAdjacentHTML('beforeend', lineRowHTML());
    A.calcBal();
  },
  calcBal: function(){
    var rows = document.querySelectorAll('#lines-box .line-row');
    var el = document.getElementById('bal-info');
    if (!el) return;
    var d = 0, c = 0;
    rows.forEach(function(r){
      var dc = r.querySelector('[name=dc]').value;
      var amt = parseFloat(r.querySelector('[name=amt]').value) || 0;
      if (dc === '借') d += c100(amt); else c += c100(amt);
    });
    var diff = Math.abs(d - c);
    if (!d && !c){
      el.className = 'balbar';
      el.textContent = '填写金额后自动试算';
    } else if (diff === 0){
      el.className = 'balbar ok';
      el.textContent = '借 ' + money(d) + ' = 贷 ' + money(c) + '(平衡)';
    } else {
      el.className = 'balbar bad';
      el.textContent = '借 ' + money(d) + ' / 贷 ' + money(c) + ' / 差额 ' + money(diff) + '(不平)';
    }
  },
  applyTemplate: function(i){
    var t = TPLATES[i];
    var form = document.getElementById('vform');
    if (!form || !t) return;
    form.querySelector('[name=summary]').value = t.summary;
    document.getElementById('lines-box').innerHTML =
      t.lines.map(function(l){ return lineRowHTML(l); }).join('');
    A.calcBal();
  },
  submitVoucher: function(e){
    e.preventDefault();
    var form = e.target;
    var rows = form.querySelectorAll('#lines-box .line-row');
    var lines = [];
    rows.forEach(function(r){
      lines.push({
        acc: r.querySelector('[name=acc]').value,
        dc: r.querySelector('[name=dc]').value,
        amt: parseFloat(r.querySelector('[name=amt]').value) || 0
      });
    });
    var payload = {
      date: form.date.value,
      attach: form.attach.value,
      summary: form.summary.value,
      lines: lines
    };
    if (SERVER_MODE){
      serverAction('/vouchers', payload, function(j){ return '凭证 ' + (j.id || '') + ' 已录入,进入待复核队列'; })
        .then(function(j){ if (j) location.hash = '#/vouchers'; });
      return;
    }
    var r = createVoucher(S, sess.uid, payload);
    if (r.ok){
      save();
      A.showToast('凭证 ' + r.id + ' 已录入,进入待复核队列');
      location.hash = '#/vouchers';
    } else {
      A.showToast(r.err, true);
    }
  },

  /* 列表与页面状态 */
  vSearch: function(q){
    vfQ = q;
    var tb = document.getElementById('vtbody');
    if (tb){
      tb.innerHTML = voucherRowsHTML();
      var cnt = document.getElementById('vf-count');
      if (cnt) cnt.textContent = filteredVoucherCount() + ' 笔';
    }
  },
  vFilter: function(){
    vfMonth = document.getElementById('vf-month').value;
    vfStatus = document.getElementById('vf-status').value;
    route();
  },
  pickAcc: function(code){ ledAcc = code; route(); },
  setLedMonth: function(m){ ledMonth = m; route(); },
  setRpt: function(t){ rptTab = t; route(); },
  setIsMonth: function(m){ isMonth = m; route(); },
  setTbMonth: function(m){ tbMonth = m; route(); },

  /* 结账 */
  closeMonth: function(){
    var m = monthOf(TODAY);
    A.askConfirm('确认结账', '将执行 ' + m + ' 损益自动结转并封账,结账后当月不可再录入、复核与红冲。',
      '确认结账', true, function(){
        if (SERVER_MODE){ serverAction('/close', {}, m + ' 结账完成,期间已冻结'); return; }
        var r = closeMonth(S, m, sess.uid);
        if (r.ok){ save(); A.showToast(m + ' 结账完成,期间已冻结'); route(); }
        else A.showToast(r.err, true);
      });
  },
  unclose: function(){
    A.askConfirm('确认反结账', '将作废当月结转凭证并恢复记账状态,此操作会记录在操作日志中。',
      '确认反结账', true, function(){
        if (SERVER_MODE){ serverAction('/unclose', {}, '已反结账,恢复可记账'); return; }
        var r = uncloseLast(S, sess.uid);
        if (r.ok){ save(); A.showToast(r.month + ' 已反结账,恢复可记账'); route(); }
        else A.showToast(r.err, true);
      });
  },

  /* 成员 */
  addMember: function(){
    var name = document.getElementById('new-m-name').value;
    var role = document.getElementById('new-m-role').value;
    if (SERVER_MODE){
      serverAction('/members', { name: name, role: role }, '成员添加成功(初始口令 123456)');
      return;
    }
    var r = memberAdd(S, sess.uid, name, role);
    if (r.ok){ save(); A.showToast('成员添加成功'); route(); }
    else A.showToast(r.err, true);
  },
  setRole: function(id){
    var m = S.members.filter(function(x){ return x.id === id; })[0];
    if (!m) return;
    var to = m.role === 'admin' ? 'viewer' : 'admin';
    var label = to === 'admin' ? '管理员(可记账)' : '只读成员';
    A.askConfirm('变更角色', '将 ' + m.name + ' 设为 ' + label + '?', '确认变更', false, function(){
      if (SERVER_MODE){ serverAction('/members/' + encodeURIComponent(id) + '/role', { role: to }, '角色已更新'); return; }
      var r = memberRole(S, sess.uid, id, to);
      if (r.ok){ save(); A.showToast('角色已更新'); route(); }
      else A.showToast(r.err, true);
    });
  },
  removeMember: function(id){
    var m = S.members.filter(function(x){ return x.id === id; })[0];
    if (!m) return;
    A.askConfirm('移除成员', '确认移除 ' + m.name + '?其历史制单与复核记录仍保留。', '确认移除', true, function(){
      if (SERVER_MODE){ serverAction('/members/' + encodeURIComponent(id) + '/remove', {}, '成员已移除'); return; }
      var r = memberRemove(S, sess.uid, id);
      if (r.ok){ save(); A.showToast('成员已移除'); route(); }
      else A.showToast(r.err, true);
    });
  },

  /* 公示 */
  regenKey: function(){
    A.askConfirm('重新生成密钥', '重新生成后既有对外公示链接立即失效,确定继续?', '重新生成', true, function(){
      if (SERVER_MODE){ serverAction('/regen-key', {}, function(j){ return '已更新密钥:' + (j.key || ''); }); return; }
      var r = regenKey(S, sess.uid);
      if (r.ok){ save(); A.showToast('已更新密钥:' + r.key); route(); }
    });
  },
  copyLink: function(){
    var link = location.origin + location.pathname + '#/pub/' + S.publicKey;
    function ok(){ A.showToast('链接已复制'); }
    function fail(){ A.showToast('复制失败,请手动选择复制', true); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(ok, fail);
    } else {
      var ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta); ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      done ? ok() : fail();
    }
  },
  printPub: function(){ window.print(); },
  exportCsv: function(){
    var rows = [['记账日期','凭证字号','摘要','金额(元)','状态']];
    if (SERVER_MODE && PUB_DATA){
      PUB_DATA.eff.forEach(function(v){
        rows.push([v.date, v.id, v.summary, (v.total / 100).toFixed(2), v.status]);
      });
    } else {
      effV(S, TODAY).forEach(function(v){
        rows.push([v.date, v.id, v.summary, (voucherTotal(v) / 100).toFixed(2), v.status]);
      });
    }
    var csv = '\uFEFF' + rows.map(function(r){
      return r.map(function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = '众账本公示流水.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  },

  /* 数据备份 */
  dataModal: function(){
    document.getElementById('overlay').innerHTML =
    '<div class="modal-back" onclick="if(event.target===this)A.closeModal()">' +
      '<div class="sheet">' +
        '<h3>账本数据</h3>' +
        '<div class="sub">' + (SERVER_MODE ? '服务器端账本状态 JSON 镜像,可复制备份,也可粘贴后导入恢复' : '全部账务状态的 JSON 镜像,可复制备份,也可粘贴后导入恢复') + '</div>' +
        '<textarea id="backup-json">加载中…</textarea>' +
        '<div class="sheet-actions">' +
          '<button type="button" class="btn" onclick="A.copyBackup()">复制</button>' +
          '<button type="button" class="btn pri" onclick="A.importBackup()">导入恢复</button>' +
          '<button type="button" class="btn danger" onclick="A.resetData()">重置演示数据</button>' +
          '<button type="button" class="btn ghost" onclick="A.closeModal()">关闭</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    var ta = document.getElementById('backup-json');
    if (SERVER_MODE){
      apiFetch('/raw').then(function(r){
        if (ta) ta.value = (r.j && r.j.ok) ? r.j.raw : ((r.j && r.j.err) || '加载失败');
      }).catch(function(){ if (ta) ta.value = '加载失败'; });
    } else if (ta) {
      ta.value = JSON.stringify(S, null, 2);
    }
  },
  copyBackup: function(){
    var ta = document.getElementById('backup-json');
    if (!ta) return;
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch(e){}
    if (!done && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value);
      done = true;
    }
    A.showToast(done ? '已复制到剪贴板' : '请手动全选复制', !done);
  },
  importBackup: function(){
    var txt = document.getElementById('backup-json').value;
    if (SERVER_MODE){
      serverAction('/import', { json: txt }, '导入成功').then(function(j){
        if (j){ A.closeModal(); location.hash = '#/overview'; }
      });
      return;
    }
    var obj;
    try { obj = JSON.parse(txt); }
    catch(e){ A.showToast('JSON 解析失败:' + e.message, true); return; }
    if (!obj || !Array.isArray(obj.vouchers) || !Array.isArray(obj.members) || !Array.isArray(obj.closeLog)){
      A.showToast('数据结构不像账本备份', true); return;
    }
    A.askConfirm('导入恢复', '用文本框中的内容覆盖当前账本?此操作不可撤销。', '覆盖导入', true, function(){
      S = obj; save();
      A.closeModal();
      A.showToast('导入成功');
      location.hash = '#/overview';
      route();
    });
  },
  resetData: function(){
    A.askConfirm('重置演示数据', SERVER_MODE ? '清空服务器上的账本,恢复到初始演示数据,所有在线成员同步生效。' : '清空本浏览器保存的账本,恢复到初始演示数据。', '重置', true, function(){
      if (SERVER_MODE){ serverAction('/reset', {}, '已重置为初始演示数据'); return; }
      localStorage.removeItem(STORE_KEY);
      location.hash = '';
      location.reload();
    });
  }
};
var askCb = null;

window.addEventListener('hashchange', route);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('overlay').innerHTML) A.closeModal();
});
heartbeat();
setInterval(heartbeat, 3000);
boot();

})();
</script>
